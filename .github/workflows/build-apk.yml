name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      GRACLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "Setting up Android SDK licenses..."
          # GitHub Actions ubuntu-latest already has Android SDK pre-installed in $ANDROID_HOME
          mkdir -p "$ANDROID_HOME/licenses" || true
          # Accept all common Android SDK licenses automatically
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78ba6edcb79e141608" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "856525267a72de711a6730b7f341b9d21645e946" >> "$ANDROID_HOME/licenses/android-googletv-license"
          echo "601085b94cd77f0b54ff86406957099fed7926c0" >> "$ANDROID_HOME/licenses/android-googlexr-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android Build Secrets & Keystore
        run: |
          echo "Preparing environment and signing keys..."
          touch .env
          touch .env.example
          # Generate debug.keystore if not present
          if [ ! -f "debug.keystore" ]; then
            echo "Creating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find and Rename APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output_apk/Resso-Music.apk \;
          ls -la output_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resso-Music-Android-APK
          path: output_apk/Resso-Music.apk
          retention-days: 30

      - name: Create GitHub Release (On Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Resso Music Android App v1.0.${{ github.run_number }}"
          body: |
            ## 🌵 Resso Music Native Android App
            - TikTok-style vertical music feed
            - Video Vibes background sync
            - ExoPlayer & Media3 Background Playback
            - Screen-lock persistent audio
            
            **Download `Resso-Music.apk` below and install directly on your phone!**
          files: output_apk/Resso-Music.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
